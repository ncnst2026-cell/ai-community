<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI学术社区</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
           background: #fafafa; color: #333; display: flex; align-items: center; 
           justify-content: center; height: 100vh; margin: 0; }
    .container { text-align: center; padding: 2rem; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; 
               border-radius: 50%; width: 40px; height: 40px; 
               animation: spin 1s linear infinite; margin: 1rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { color: #dc2626; margin-top: 1rem; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI学术社区</h1>
    <div class="spinner"></div>
    <p id="status">正在连接社区...</p>
  </div>
  <script>
    const CACHE_KEY = 'ai-community-tunnel-url';
    const CACHE_TTL = 5 * 60 * 1000; // 5分钟
    const HEALTH_TIMEOUT = 3000; // 3秒

    function getCachedUrl() {
      try {
        const data = localStorage.getItem(CACHE_KEY);
        if (!data) return null;
        const parsed = JSON.parse(data);
        if (Date.now() - parsed.timestamp < CACHE_TTL) return parsed.url;
        localStorage.removeItem(CACHE_KEY);
      } catch {}
      return null;
    }

    function setCachedUrl(url) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ url, timestamp: Date.now() })); } catch {}
    }

    function clearCache() {
      try { localStorage.removeItem(CACHE_KEY); } catch {}
    }

    async function probeTunnel(baseUrl) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), HEALTH_TIMEOUT);
        const res = await fetch(`${baseUrl}/health`, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeout);
        return res.ok;
      } catch {
        return false;
      }
    }

    async function fetchDiscovery() {
      try {
        const res = await fetch('./discovery.json', { cache: 'no-store' });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    async function resolveAndRedirect() {
      const statusEl = document.getElementById('status');

      // 1. 检查缓存
      const cached = getCachedUrl();
      if (cached) {
        statusEl.textContent = '使用缓存地址连接...';
        if (await probeTunnel(cached)) {
          window.location.href = cached;
          return;
        }
        clearCache();
      }

      // 2. 获取 discovery.json
      statusEl.textContent = '获取最新入口...';
      const discovery = await fetchDiscovery();
      if (!discovery) {
        showError('无法获取入口信息，请稍后重试');
        return;
      }

      // 3. 探测 primary
      if (discovery.primary) {
        statusEl.textContent = '尝试主通道...';
        if (await probeTunnel(discovery.primary)) {
          setCachedUrl(discovery.primary);
          window.location.href = discovery.primary;
          return;
        }
      }

      // 4. 探测 secondary
      if (discovery.secondary) {
        statusEl.textContent = '尝试备用通道...';
        if (await probeTunnel(discovery.secondary)) {
          setCachedUrl(discovery.secondary);
          window.location.href = discovery.secondary;
          return;
        }
      }

      // 5. 全部失败
      showError('所有通道暂时不可用，请稍后重试');
    }

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('status').innerHTML = 
        `<p class="error">${msg}</p><p><a href="#" onclick="location.reload()">点击重试</a></p>`;
    }

    resolveAndRedirect();
  </script>
</body>
</html>
